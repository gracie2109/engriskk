<title>Lộ Trình 90 TOEIC</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: mobile-first single column with bottom tab bar; sidebar nav from 900px. Teal primary, amber for streak/XP, emerald for correct. */
:root{
  --bg:#f6f8fb;--surface:#ffffff;--surface2:#eef3f6;--fg:#0f1f2b;--muted:#587080;--line:#dde5ec;
  --primary:#0f6b72;--primary-fg:#ffffff;--primary-soft:#d9eef0;
  --amber:#b45309;--amber-soft:#fdf0d9;--good:#0b7a55;--good-soft:#d8f3e7;--bad:#b42318;--bad-soft:#fde3e0;
  --ring:#0f6b72;--font:'Be Vietnam Pro',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c161d;--surface:#142330;--surface2:#1b2f3e;--fg:#e8f1f6;--muted:#93aab9;--line:#25394a;
  --primary:#5cc4cb;--primary-fg:#06262a;--primary-soft:#143c42;
  --amber:#f5b14a;--amber-soft:#3a2b10;--good:#47d6a0;--good-soft:#103a2c;--bad:#ff8a7e;--bad-soft:#40201d;--ring:#5cc4cb;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c161d;--surface:#142330;--surface2:#1b2f3e;--fg:#e8f1f6;--muted:#93aab9;--line:#25394a;
  --primary:#5cc4cb;--primary-fg:#06262a;--primary-soft:#143c42;
  --amber:#f5b14a;--amber-soft:#3a2b10;--good:#47d6a0;--good-soft:#103a2c;--bad:#ff8a7e;--bad-soft:#40201d;--ring:#5cc4cb;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:15px;line-height:1.55;margin:0;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
h1,h2,h3{margin:0;line-height:1.25;text-wrap:balance}
h1{font-size:1.5rem;font-weight:800}h2{font-size:1.1rem;font-weight:700}h3{font-size:.98rem;font-weight:700}
p{margin:0}
.app{display:grid;grid-template-columns:1fr;min-height:100vh}
main{width:100%;max-width:760px;margin:0 auto;min-width:0;padding-block:18px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
nav.tabs a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;border-radius:12px;color:var(--muted);text-decoration:none;font-size:.7rem;font-weight:600;min-width:0}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--primary);background:var(--primary-soft)}
.brand{display:none}
@media (min-width:900px){
  .app{grid-template-columns:230px 1fr}
  nav.tabs{position:sticky;top:0;height:100vh;flex-direction:column;justify-content:flex-start;gap:4px;padding:20px 12px;border-top:0;border-right:1px solid var(--line);align-self:start}
  nav.tabs a{flex:none;flex-direction:row;gap:12px;padding:11px 14px;font-size:.92rem}
  .brand{display:block;font-weight:800;font-size:1.05rem;padding:0 14px 14px;color:var(--primary)}
  main{padding-block:28px 48px}
}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.flat{background:var(--surface2);border-radius:12px;padding:12px 14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}.small{font-size:.82rem}.tiny{font-size:.74rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.06)}
.btn.sm{min-height:36px;padding:6px 12px;font-size:.85rem}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:.76rem;font-weight:700;background:var(--primary-soft);color:var(--primary)}
.pill.amber{background:var(--amber-soft);color:var(--amber)}.pill.good{background:var(--good-soft);color:var(--good)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.bar{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden}.bar>i{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .4s}
.stat b{display:block;font-size:1.35rem;font-weight:800;font-variant-numeric:tabular-nums}
.stat span{font-size:.76rem;color:var(--muted)}
.task{display:flex;gap:12px;align-items:center;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);text-decoration:none;color:inherit;cursor:pointer;width:100%;text-align:left}
.task:hover{background:var(--surface2)}
.task .chk{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center;color:transparent;background:transparent;cursor:pointer;padding:0}
.task.done .chk{background:var(--good);border-color:var(--good);color:#fff}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.chk svg{width:16px;height:16px}
.tt{font-weight:600}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px}
.back{background:none;border:0;padding:6px 8px 6px 0;color:var(--muted);cursor:pointer;display:inline-flex;gap:4px;align-items:center;font-weight:600;min-height:40px}
.back svg{width:18px;height:18px}
.opt{display:flex;gap:12px;align-items:flex-start;text-align:left;width:100%;padding:12px 14px;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;cursor:pointer}
.opt:hover:not([disabled]){border-color:var(--primary)}
.opt .l{flex:none;width:26px;height:26px;border-radius:8px;background:var(--surface2);display:grid;place-items:center;font-weight:700;font-size:.8rem}
.opt.sel{border-color:var(--primary);background:var(--primary-soft)}
.opt.ok{border-color:var(--good);background:var(--good-soft)}.opt.no{border-color:var(--bad);background:var(--bad-soft)}
.stem{font-size:1.08rem;font-weight:600}
.ctx{background:var(--surface2);border-radius:12px;padding:14px;white-space:pre-line;font-size:.93rem}
.list{display:flex;flex-direction:column;gap:10px}
.menu{display:flex;gap:14px;align-items:center;padding:14px;border-radius:14px;border:1px solid var(--line);background:var(--surface);text-decoration:none;color:inherit;width:100%;text-align:left;cursor:pointer}
.menu:hover{border-color:var(--primary)}
.menu .ico{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;flex:none}
.menu .ico svg{width:24px;height:24px}
textarea,input[type=text],input[type=date],select{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;min-height:44px}
textarea{min-height:96px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.88rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{flex:1 1 auto;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 12px;font-weight:600;cursor:pointer;min-height:44px}
.seg button[aria-pressed="true"]{border-color:var(--primary);background:var(--primary-soft);color:var(--primary)}
.diff{display:flex;flex-wrap:wrap;gap:4px 6px;font-size:1.02rem}
.w-ok{color:var(--good)}.w-no{color:var(--bad);text-decoration:line-through}.w-miss{background:var(--amber-soft);color:var(--amber);border-radius:6px;padding:0 5px}
.heat{display:grid;grid-template-columns:repeat(13,minmax(0,1fr));gap:4px}
.heat i{aspect-ratio:1;border-radius:4px;background:var(--surface2);display:block}
.heat i.l1{background:var(--primary-soft)}.heat i.l2{background:color-mix(in srgb,var(--primary) 55%,var(--surface))}.heat i.l3{background:var(--primary)}
.heat i.today{outline:2px solid var(--amber);outline-offset:1px}
.fc{min-height:200px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;cursor:pointer;padding:24px 16px}
.fc .w{font-size:2rem;font-weight:800;color:var(--primary)}
.chart{width:100%;max-width:560px;height:auto;display:block}
.tbl{width:100%;border-collapse:collapse;font-size:.9rem}.tbl td,.tbl th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}
.scroll-x{overflow-x:auto}
.day{display:flex;gap:10px;padding:10px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.day .n{flex:none;width:40px;font-weight:800;color:var(--primary);font-variant-numeric:tabular-nums}
.day.cur{background:var(--primary-soft);border-radius:10px;padding-inline:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;font-size:.88rem;max-width:90vw}
.ob{max-width:520px;margin:0 auto;padding-block:32px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.logo{width:48px;height:48px;border-radius:14px;background:var(--primary);color:var(--primary-fg);display:grid;place-items:center;font-weight:800;font-size:1.05rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

, ["must", "may", "can", "would"], 0, "modal", "'must' diễn tả bắt buộc theo quy định."], ["There isn't ___ coffee left in the kitchen.", ["some", "any", "many", "a few"], 1, "count", "Coffee là danh từ không đếm được; câu phủ định dùng 'any'."], ["Could you send me ___ email you mentioned this morning?", ["a", "an", "the", "no article"], 2, "article", "Email đã được nhắc đến cụ thể nên dùng 'the'."], ["The meeting starts ___ 9 a.m. ___ Monday.", ["in / on", "at / on", "on / at", "at / in"], 1, "prep", "'at' + giờ, 'on' + thứ trong tuần."], ["She is interested ___ learning cloud computing.", ["on", "in", "at", "for"], 1, "prep", "Cụm cố định: be interested in."], ["Our new laptop is ___ than the old one.", ["fast", "faster", "fastest", "more fast"], 1, "comp", "'than' báo hiệu so sánh hơn; tính từ ngắn thêm -er."], ["This is the ___ restaurant in the neighborhood.", ["good", "better", "best", "most good"], 2, "comp", "Có 'the' và phạm vi 'in the neighborhood' nên dùng so sánh nhất: best."], ["She enjoys ___ code in the evening.", ["write", "to write", "writing", "wrote"], 2, "ger", "Sau 'enjoy' dùng V-ing."], ["We decided ___ the contract yesterday.", ["sign", "signing", "to sign", "signed"], 2, "ger", "Sau 'decide' dùng to + động từ."], ["The report ___ by the finance team last week.", ["wrote", "was written", "is written", "has written"], 1, "passive", "Báo cáo bị viết bởi bộ phận tài chính, quá khứ nên dùng 'was written'."], ["All invoices must ___ before the end of the month.", ["pay", "be paid", "paying", "paid"], 1, "passive", "Sau 'must' dùng động từ nguyên mẫu; bị động là 'be paid'."], ["We need a ___ solution to this problem.", ["rely", "reliable", "reliably", "reliability"], 1, "wordform", "Trước danh từ 'solution' cần tính từ: reliable."], ["The manager spoke ___ about the new policy.", ["clear", "clearly", "clearness", "clarity"], 1, "wordform", "Bổ nghĩa cho động từ 'spoke' cần trạng từ: clearly."], ["Her ___ to the team was very valuable.", ["contribute", "contributor", "contribution", "contributive"], 2, "wordform", "Sau tính từ sở hữu 'Her' cần danh từ; 'contribution to' là cụm hợp nghĩa."], ["Please ___ the form carefully before submitting.", ["complete", "completion", "completely", "completed"], 0, "wordform", "Câu mệnh lệnh cần động từ nguyên mẫu: complete."], ["I will call you ___ I arrive at the airport.", ["when", "during", "because of", "despite"], 0, "conj", "Cần liên từ nối hai mệnh đề: when."], ["___ it was raining, the event started on time.", ["Because", "Although", "However", "Despite"], 1, "conj", "Hai vế đối lập, theo sau là mệnh đề: Although."], ["The event was cancelled ___ the bad weather.", ["because", "although", "because of", "so"], 2, "conj", "Sau chỗ trống là cụm danh từ nên dùng 'because of'."], ["The engineer ___ designed this system is on leave.", ["who", "which", "whose", "where"], 0, "rel", "Thay cho người làm chủ ngữ: who."], ["The laptop ___ I bought last month already has a problem.", ["who", "which", "whose", "where"], 1, "rel", "Thay cho vật: which (hoặc that)."], ["If it ___ tomorrow, we will cancel the trip.", ["rain", "rains", "will rain", "rained"], 1, "cond", "Điều kiện loại 1: if + hiện tại đơn, will + động từ."], ["If I ___ more time, I would learn another language.", ["have", "had", "will have", "would have"], 1, "cond", "Điều kiện loại 2: if + quá khứ đơn, would + động từ."], ["I ___ my keys. Can you help me look for them?", ["lose", "lost", "have lost", "am losing"], 2, "perfect", "Hành động quá khứ còn ảnh hưởng hiện tại: have lost."], ["By the time we arrived, the meeting ___ already started.", ["has", "had", "was", "is"], 1, "past", "Hành động xảy ra trước một mốc quá khứ dùng quá khứ hoàn thành: had started."], ["The new software is ___ than the previous version.", ["more efficient", "most efficient", "efficienter", "efficient"], 0, "comp", "Tính từ dài so sánh hơn: more + adj + than."], ["Neither the manager ___ the staff was informed.", ["or", "nor", "and", "but"], 1, "conj", "Cặp liên từ: neither ... nor."], ["She has worked here ___ five years.", ["since", "for", "during", "from"], 1, "perfect", "'for' + khoảng thời gian; 'since' + mốc thời gian."], ["Please submit the application ___ Friday at the latest.", ["in", "on", "by", "at"], 2, "prep", "'by' nghĩa là chậm nhất vào lúc đó."], ["He apologized ___ being late.", ["for", "to", "at", "with"], 0, "prep", "Cụm cố định: apologize for."], ["We are looking forward to ___ you at the conference.", ["meet", "meeting", "met", "have met"], 1, "ger", "Sau 'look forward to' dùng V-ing."], ["The customer asked ___ a refund.", ["for", "to", "at", "of"], 0, "prep", "Cụm cố định: ask for."], ["There ___ three meetings scheduled for tomorrow.", ["is", "are", "be", "being"], 1, "tobe", "Chủ ngữ thật 'three meetings' là số nhiều nên dùng 'are'."], ["Each of the employees ___ a badge.", ["have", "has", "are having", "having"], 1, "ps", "'Each of' đi với động từ số ít: has."]], "p2": [["Where is the printer?", ["It's on the second floor.", "Yes, it works well.", "At two o'clock."], "'Where' hỏi nơi chốn nên đáp án chỉ vị trí."], ["When does the training start?", ["At nine tomorrow.", "In the main hall.", "Mr. Lee will teach it."], "'When' hỏi thời gian."], ["Who is leading the project?", ["Ms. Tran is.", "Last month.", "It's very long."], "'Who' hỏi người."], ["How long will the update take?", ["About twenty minutes.", "By email.", "The new version."], "'How long' hỏi khoảng thời gian."], ["Why was the meeting postponed?", ["Because the client is traveling.", "In room 4.", "Yes, I will attend."], "'Why' hỏi lý do nên chọn câu bắt đầu bằng 'Because'."], ["Could you send me the schedule?", ["Sure, I'll do it now.", "Two hours ago.", "It was on the table."], "Lời nhờ vả lịch sự thường được đáp lại bằng sự đồng ý."], ["Do you want tea or coffee?", ["Coffee, thanks.", "Yes, please.", "At the cafe."], "Câu hỏi lựa chọn 'or' cần chọn một trong hai."], ["Should we order lunch for the team?", ["No, they brought their own.", "At noon.", "It's too heavy."], "Câu hỏi 'Should we' xin ý kiến; đáp án đưa ra quyết định hợp lý."], ["What time does the store close?", ["At ten p.m.", "It's near the bank.", "Two dollars."], "'What time' hỏi giờ."], ["Isn't the deadline on Friday?", ["No, it was moved to Monday.", "Yes, a long road.", "I like it."], "Câu hỏi xác nhận; đáp án phủ nhận và nêu thông tin đúng."], ["How much is the monthly fee?", ["Thirty dollars.", "Every month.", "At the front desk."], "'How much' hỏi giá tiền."], ["Which desk is yours?", ["The one by the window.", "Yes, it is.", "Next week."], "'Which' hỏi lựa chọn cụ thể."], ["Would you like to join us for dinner?", ["I'd love to.", "He joined last year.", "It's a big table."], "Lời mời được đáp bằng chấp nhận hoặc từ chối lịch sự."], ["Where did you put the keys?", ["In the top drawer.", "Yes, they are.", "Around six."], "'Where' hỏi vị trí."], ["Has the invoice been paid?", ["Not yet, I'll check today.", "A blue pen.", "In the invoice room."], "Câu hỏi Yes/No về trạng thái; 'Not yet' là đáp án phù hợp."]], "p3": [{"lines": ["Woman: Hi Ken, did you finish the sales report?", "Man: Almost. I'm waiting for numbers from the Seoul office.", "Woman: The deadline is tomorrow morning. Can you send a draft tonight?", "Man: Yes, I'll email it by eight."], "qs": [["What is the man waiting for?", ["Numbers from another office", "Approval from his manager", "A new computer", "A meeting room"], "Người đàn ông nói đang đợi số liệu từ văn phòng Seoul."], ["What will the man do tonight?", ["Send a draft", "Call the client", "Visit Seoul", "Cancel the meeting"], "Anh ấy hứa gửi email bản nháp trước tám giờ."]]}, {"lines": ["Man: Excuse me, is the ten o'clock train to Hanoi on time?", "Woman: It's delayed by thirty minutes because of a signal problem.", "Man: Then I'll have time to buy a coffee. Where is the cafe?", "Woman: Down the hall, next to platform two."], "qs": [["Why is the train late?", ["There is a signal problem", "The weather is bad", "There is a strike", "There are few passengers"], "Người phụ nữ nêu nguyên nhân: signal problem."], ["Where does the man want to go?", ["A cafe", "The ticket office", "Platform one", "The airport"], "Anh ấy hỏi cafe nằm ở đâu."]]}, {"lines": ["Woman: Our team lunch is on Friday. Do you prefer Italian or Vietnamese food?", "Man: Vietnamese, but Linh is vegetarian.", "Woman: Then let's pick a place with vegetarian options. I'll book a table for eight.", "Man: Great. Please make it for twelve o'clock."], "qs": [["What is the conversation mainly about?", ["A team lunch plan", "A job interview", "A product launch", "A holiday"], "Cả hai bàn kế hoạch bữa trưa của nhóm."], ["What does the man ask the woman to do?", ["Reserve the table for noon", "Cancel Friday's lunch", "Order food online", "Invite Linh"], "Anh ấy nhờ đặt bàn vào lúc 12 giờ."]]}, {"lines": ["Man: The website has been slow since this morning.", "Woman: I know. The developers are checking the server.", "Man: Should I tell customers?", "Woman: Yes, post a short notice and apologize for the delay."], "qs": [["What problem do they discuss?", ["A slow website", "Wrong prices", "Late delivery", "A lost password"], "Họ nói trang web chậm từ sáng."], ["What does the woman suggest?", ["Posting a notice", "Restarting the computers", "Hiring developers", "Closing the site"], "Cô ấy đề nghị đăng thông báo ngắn và xin lỗi."]]}], "p7": [{"title": "Email", "text": "Subject: Office maintenance\n\nDear staff,\n\nThe air conditioning system will be serviced on Saturday, December 5, from 8 a.m. to 2 p.m. The building will remain open, but the third floor may be warm. Please save your work before leaving on Friday and remove personal items from the windowsills.\n\nContact Ms. Hoa in Facilities at extension 214 with questions.\n\nThank you.", "qs": [["Why was the email written?", ["To announce a service", "To request a refund", "To invite staff to a party", "To report a bill"], "Email thông báo việc bảo trì điều hòa."], ["What might happen on the third floor?", ["It may be warm", "It will be closed", "It will be painted", "It will be noisy"], "Bài viết nói 'the third floor may be warm'."], ["Who can answer questions?", ["Ms. Hoa", "A manager", "The landlord", "Security"], "Liên hệ Ms. Hoa ở bộ phận Facilities."]]}, {"title": "Notice", "text": "RIVERSIDE GYM\n\nNew opening hours from January 4:\nMonday to Friday: 5:30 a.m. to 10:00 p.m.\nSaturday: 7:00 a.m. to 8:00 p.m.\nSunday: closed for cleaning.\n\nMembers who renew before December 20 receive one free personal training session. Please bring your member card to the front desk.", "qs": [["What is changing?", ["Opening hours", "Membership fee", "The address", "Trainer names"], "Thông báo giờ mở cửa mới."], ["When is the gym closed?", ["Sunday", "Saturday", "Monday", "Friday"], "Chủ nhật đóng cửa để dọn dẹp."], ["How can members get a free session?", ["Renew before December 20", "Bring a friend", "Visit on Sunday", "Show a coupon"], "Gia hạn trước ngày 20 tháng 12 được tặng buổi tập."]]}, {"title": "Chat", "text": "Minh (9:02): The test environment is down again.\nLan (9:05): I restarted it, but the database still isn't responding.\nMinh (9:07): Should we delay the demo?\nLan (9:10): Not yet. I'll ask the IT team to check it before 10. If it isn't fixed, we'll move the demo to the afternoon.", "qs": [["What problem are they discussing?", ["A test environment is not working", "A late invoice", "A missing laptop", "A new hire"], "Môi trường kiểm thử bị lỗi."], ["What will Lan do?", ["Ask the IT team for help", "Restart the demo", "Write a report", "Call the client"], "Lan sẽ nhờ nhóm IT kiểm tra."], ["What will happen if the problem is not fixed?", ["The demo will move to the afternoon", "The demo will be cancelled", "The team will work overtime", "Minh will resign"], "Nếu chưa sửa xong, demo dời sang buổi chiều."]]}, {"title": "Job advertisement", "text": "WANTED: Customer Support Assistant\n\nBrightline Software : The report was written by the finance team.", ["The invoice was paid.", "All forms must be submitted."]], ["conj", "Liên từ", "because + mệnh đề, because of + cụm danh từ; although + mệnh đề (đối lập); neither ... nor, either ... or.", ["Although it rained, we went.", "Because of the delay, we left late."]], ["rel", "Mệnh đề quan hệ", "who thay cho người, which thay cho vật, whose chỉ sở hữu, where chỉ nơi chốn, that dùng cho cả người và vật.", ["The man who called is my client.", "The tool which we use is free."]], ["cond", "Câu điều kiện", "Loại 1: If + hiện tại đơn, will + V (có thể xảy ra). Loại 2: If + quá khứ đơn, would + V (giả định).", ["If it rains, we will stay.", "If I had time, I would study more."]]], "speak": [["Tự giới thiệu", "Nói 45-60 giây về bạn: tên, công việc, nơi làm việc, vì sao học tiếng Anh.", ["Hello, my name is Linh. I am a full-stack developer.", "I work for a software company in Ho Chi Minh City.", "My team is small, but we are very busy.", "I am learning English because I want to speak with my coworkers."]], ["Báo cáo stand-up", "Nói 3 ý: hôm qua làm gì, hôm nay làm gì, đang vướng gì.", ["Yesterday I fixed a bug in the login page.", "Today I am going to work on the payment API.", "I am blocked because the test server is down."]], ["Mô tả một lỗi", "Giải thích lỗi xảy ra khi nào, hậu quả và cách sửa trong 1 phút.", ["The bug happens when the user clicks the button twice.", "The page sends two requests, so the order is created twice.", "I fixed it by disabling the button after the first click."]], ["Mô tả nơi làm việc", "Mô tả văn phòng, đồng nghiệp và một ngày làm việc thông thường.", ["My office is on the fifth floor of a small building.", "I sit next to the window, and my team sits nearby.", "Every morning we have a short meeting at nine o'clock."]], ["Hẹn lịch họp", "Đề nghị một giờ họp, hỏi người kia có rảnh không và chốt lịch.", ["Are you free on Thursday afternoon?", "Could we meet at three o'clock?", "Great, I will send you a ca const ymd=(d=new Date())=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ymd(d)};
const diffD=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
const fmt=s=>{const d=pd(s);return pad(d.getDate())+'/'+pad(d.getMonth()+1)};
const today=()=>ymd();
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

/* ---------- speech ---------- */
const hasTTS='speechSynthesis' in window&&'SpeechSynthesisUtterance' in window;
let voices=[];if(hasTTS){const lv=()=>{voices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang))};lv();speechSynthesis.onvoiceschanged=lv}
function speak(lines,rate=1,done){
  if(!hasTTS){toast('Trình duyệt này không có giọng đọc. Hãy xem transcript.');return}
  speechSynthesis.cancel();const arr=[].concat(lines);let i=0;
  const next=()=>{if(i>=arr.length){done&&done();return}
    let t=arr[i++],pitch=1;const m=t.match(/^(Woman|Man|Speaker \w+):\s*/);
    if(m){pitch=m[1]==='Woman'?1.25:0.8;t=t.slice(m[0].length)}
    const u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate;u.pitch=pitch;
    if(voices.length){u.voice=voices.find(v=>/en-US/i.test(v.lang))||voices[0]}
    u.onend=next;u.onerror=next;speechSynthesis.speak(u)};
  next();
}
let toastT;function toast(m){document.querySelectorAll('.toast').forEach(e=>e.remove());const e=document.createElement('div');e.className='toast';e.textContent=m;document.body.appendChild(e);clearTimeout(toastT);toastT=setTimeout(()=>e.remove(),2600)}

/* ---------- state helpers ---------- */
const dayN=()=>{if(!S.profile)return 1;return Math.min(90,Math.max(1,diffD(today(),S.profile.start)+1))};
const started=()=>S.profile&&diffD(today(),S.profile.start)>=0;
function bump(pts){S.xp+=pts;const t=today();S.act[t]=(S.act[t]||0)+1;save()}
function streak(){let n=0,d=today();if(!S.act[d])d=addD(d,-1);while(S.act[d]){n++;d=addD(d,-1)}return n}
const tkey=k=>today()+':'+k;
const isDone=k=>!!S.done[tkey(k)];
function markDone(k){if(!S.done[tkey(k)]){S.done[tkey(k)]=1;save()}}
function record(q,ok){S.attempts.push({t:today(),p:q.part,c:q.topic,ok:ok?1:0});if(S.attempts.length>800)S.attempts.splice(0,S.attempts.length-800);
  const IV=[1,3,7,14,30];
  if(!ok){S.wrong[q.id]={step:0,due:addD(today(),1),n:(S.wrong[q.id]?.n||0)+1}}
}
function reviewResult(q,ok){const IV=[1,3,7,14,30];const w=S.wrong[q.id];S.attempts.push({t:today(),p:q.part,c:q.topic,ok:ok?1:0});
  if(!w)return;
  if(ok){w.step++;if(w.step>=IV.length)delete S.wrong[q.id];else w.due=addD(today(),IV[w.step])}else{w.step=0;w.due=addD(today(),1)}}
function estimate(acc){const mid=Math.round((100+acc*750)/5)*5;return[Math.max(10,mid-40),Math.min(990,mid+40)]}

/* ---------- Quiz engine ---------- */
let quiz=null;
function startQuiz(o){ // o:{title,ids,mode:'instant'|'deferred'|'review',back,onFinish}
  const qs=o.ids.map(id=>{const q=QB[id];const order=shuffle(q.opts.map((_,i)=>i));return Object.assign({},q,{_o:order,_ans:order.indexOf(q.ans)})});
  quiz=Object.assign({},o,{qs,i:0,picks:qs.map(()=>null),t0:Date.now(),showTr:false,fin:false});
  renderQuiz();
}
const L='ABCD';
function renderQuiz(){
  const Q=quiz,q=Q.qs[Q.i],pick=Q.picks[Q.i],inst=Q.mode!=='deferred',locked=inst&&pick!==null;
  const ctx=q.ctx;let c='';
  if(ctx&&ctx.audio){c='<div class="card"><div class="row"><button class="btn pri sm" data-act="play" data-r="1">'+ic('play')+' Nghe</button><button class="btn sm" data-act="play" data-r="0.7">'+ic('slow')+' Nghe chậm</button>'+((locked||Q.fin||Q.showTr)?'':'<button class="btn sm" data-act="tr">Xem transcript</button>')+'</div>'+((locked||Q.showTr)?'<div class="ctx small">'+esc(ctx.audio.join('\n'))+'</div>':'')+(hasTTS?'':'<p class="small muted">Thiết bị không có giọng đọc. Dùng transcript để làm bài.</p>')+'</div>'}
  if(ctx&&ctx.text)c='<div class="ctx"><b>'+esc(ctx.title)+'</b>\n\n'+esc(ctx.text)+'</div>';
  const opts=q._o.map((oi,k)=>{let cl='opt';if(locked){if(k===q._ans)cl+=' ok';else if(k===pick)cl+=' no'}else if(pick===k)cl+=' sel';
    return '<button class="'+cl+'" data-act="pick" data-k="'+k+'"'+(locked?' disabled':'')+'><span class="l">'+L[k]+'</span><span>'+esc(q.opts[oi])+'</span></button>'}).join('');
  const fb=locked?'<div class="flat '+(pick===q._ans?'':'')+'"><b style="color:var(--'+(pick===q._ans?'good':'bad')+')">'+(pick===q._ans?'Chính xác':'Chưa đúng. Đáp án: '+L[q._ans])+'</b><p class="small" style="margin-top:4px">'+esc(q.exp)+'</p></div>':'';
  const last=Q.i===Q.qs.length-1;
  let nav;
  if(inst)nav='<button class="btn pri block" data-act="next"'+(locked?'':' disabled')+'>'+(last?'Xem kết quả':'Câu tiếp')+'</button>';
  else nav='<div class="row"><button class="btn" data-act="prev"'+(Q.i?'':' disabled')+'>Trước</button>'+(last?'<button class="btn pri grow" data-act="finish">Nộp bài</button>':'<button class="btn pri grow" data-act="next">Tiếp</button>')+'</div>';
  const answered=Q.picks.filter(x=>x!==null).length;
  document.getElementById('root').innerHTML='<div class="app"><nav class="tabs"><div class="brand">Lộ Trình 90 TOEIC</div>'+TABS.map(t=>'<a href="#'+t[0]+'"'+(t[0]==='practice'?' aria-current="page"':'')+'>'+ic(t[2])+'<span>'+t[1]+'</span></a>').join('')+'</nav><main id="main">'+
   '<div class="top"><button class="back" data-act="quit">'+ic('back')+' Thoát</button><span class="pill">'+esc(Q.title)+'</span></div>'+
   '<div class="row between small muted"><span>Câu '+(Q.i+1)+' / '+Q.qs.length+'</span><span>'+PARTN[q.part]+(Q.mode==='deferred'?' · đã làm '+answered:'')+'</span></div>'+
   '<div class="bar"><i style="width:'+((Q.i+1)/Q.qs.length*100)+'%"></i></div>'+c+
   '<p class="stem">'+esc(q.stem)+'</p><div class="list">'+opts+'</div>'+fb+nav+'</main></div>';
  window.scrollTo(0,0);
}
function quizDone(){
  const Q=quiz;Q.fin=true;
  let ok=0;Q.qs.forEach((q,i)=>{const good=Q.picks[i]===q._ans;if(good)ok++;
    if(Q.mode==='review')reviewResult(q,good);else if(Q.mode==='deferred'||true){ if(Q.mode==='deferred'||Q.recordOnPick!==true)record(q,good)}});
  const pts=ok*10;bump(pts);
  let extra='';
  if(Q.mode==='deferred'){
    const byP={};Q.qs.forEach((q,i)=>{(byP[q.part]=byP[q.part]||[0,0]);byP[q.part][1]++;if(Q.picks[i]===q._ans)byP[q.part][0]++});
    const acc=ok/Q.qs.length,est=estimate(acc);
    S.mocks.push({t:today(),mode:Q.title,n:Q.qs.length,ok,lo:est[0],hi:est[1],by:byP,sec:Math.round((Date.now()-Q.t0)/1000)});save();
    extra='<div class="card"><h2>Ước lượng điểm: '+est[0]+'-'+est[1]+'</h2><p class="small muted">Chỉ là ước lượng từ bộ câu luyện này, không phải điểm TOEIC thật.</p>'+
     Object.keys(byP).map(p=>'<div><div class="row between small"><span>'+PARTN[p]+'</span><b>'+byP[p][0]+'/'+byP[p][1]+'</b></div><div class="bar"><i style="width:'+Math.round(byP[p][0]/byP[p][1]*100)+'%"></i></div></div>').join('')+'</div>';
  }
  const wrongList=Q.qs.map((q,i)=>[q,i]).filter(([q,i])=>Q.picks[i]!==q._ans);
  if(Q.onFinish)Q.onFinish(ok,Q.qs.length);

const norm=s=>s.toLowerCase().replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
function lcsDiff(ref,got){
  const n=ref.length,m=got.length,dp=Array.from({length:n+1},()=>new Array(m+1).fill(0));
  for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)dp[i][j]=ref[i]===got[j]?dp[i+1][j+1]+1:Math.max(dp[i+1][j],dp[i][j+1]);
  const out=[];let i=0,j=0;
  while(i<n&&j<m){if(ref[i]===got[j]){out.push(['ok',ref[i]]);i++;j++}else if(dp[i+1][j]>=dp[i][j+1]){out.push(['miss',ref[i]]);i++}else{out.push(['no',got[j]]);j++}}
  while(i<n)out.push(['miss',ref[i++]]);while(j<m)out.push(['no',got[j++]]);
  return out;
}
function dictCheck(){
  const it=D.dict[DI.i],val=document.getElementById('dtext').value;DI.val=val;
  const ref=norm(it.t),got=norm(val),d=lcsDiff(ref,got);
  const ok=d.filter(x=>x[0]==='ok').length;const acc=Math.round(ok/ref.length*100);
  const html=d.map(x=>'<span class="w-'+x[0]+'">'+esc(x[1])+'</span>').join('');
  const miss=[...new Set(d.filter(x=>x[0]==='miss').map(x=>x[1]).filter(w=>w.length>2))];
  DI.res={acc,ok,total:ref.length,html,miss};
  const prev=S.dict[DI.i];S.dict[DI.i]=Math.max(prev||0,acc);
  if(prev==null){bump(10+Math.round(acc/10))}else save();
  markDone('listen');
}

  const known=Object.values(S.srs).filter(s=>s.ivl>=7).length,dn=Object.keys(S.dict).length;
  const dtot=Object.keys(S.act).length;
  return '<div class="top"><h1>Tiến độ</h1><a class="btn sm" href="#about" aria-label="Cài đặt">'+ic('gear')+'</a></div>'+
  '<div class="grid3"><div class="card stat"><span>Chuỗi ngày</span><b style="color:var(--amber)">'+streak()+'</b></div><div class="card stat"><span>Ngày đã học</span><b>'+dtot+'</b></div><div class="card stat"><span>XP</span><b style="color:var(--amber)">'+S.xp+'</b></div></div>'+
  '<div class="card"><div class="row between"><h2>Mục tiêu '+esc(S.profile.target)+' điểm</h2>'+(last?'<span class="pill">Gần nhất ~'+Math.round((last.lo+last.hi)/2)+'</span>':'')+'</div>'+chart+'<p class="tiny muted">Điểm ước lượng từ bộ câu luyện tự biên soạn, tham khảo thôi. Điểm thật nên đo bằng đề thi chính thức.</p></div>'+
  '<div class="card"><h2>Độ chính xác theo phần</h2>'+(Object.keys(by).length?Object.keys(PARTN).filter(p=>by[p]).map(p=>{const a=Math.round(by[p][0]/by[p][1]*100);return '<div><div class="row between small"><span>'+PARTN[p]+'</span><b>'+a+'% <span class="muted">('+by[p][1]+' câu)</span></b></div><div class="bar"><i style="width:'+a+'%"></i></div></div>'}).join(''):'<p class="small muted">Chưa có dữ liệu.</p>')+'</div>'+
  '<div class="card"><h2>13 tuần của bạn</h2><div class="heat" role="img" aria-label="Lịch hoạt động 13 tuần">'+cells+'</div><p class="tiny muted">Mỗi cột là một tuần, hàng trên cùng là ngày bắt đầu kế hoạch. Ô đậm hơn là học nhiều hơn.</p></div>'+
  '<div class="grid2"><div class="card stat"><span>Từ đã thuộc</span><b>'+known+'</b></div><div class="card stat"><span>Câu chép đã làm</span><b>'+dn+'/'+D.dict.length+'</b></div></div>';
}

/* ---------- About / settings ---------- */
function vAbout(){
  const p=S.profile;
  return '<div class="top"><a class="back" href="#progress">'+ic('back')+' Tiến độ</a></div><h1>Cài đặt</h1>'+
  '<div class="card"><h2>Giao diện</h2><div class="seg">'+[['auto','Theo hệ thống'],['light','Sáng'],['dark','Tối']].map(t=>'<button data-act="theme" data-v="'+t[0]+'" aria-pressed="'+(S.theme===t[0])+'">'+t[1]+'</button>').join('')+'</div></div>'+
  '<div class="card"><h2>Hồ sơ</h2><p class="small">'+esc(p.name||'Bạn')+' · hiện tại '+esc(p.level)+' · mục tiêu '+esc(p.target)+' · '+p.daily+' phút/ngày · bắt đầu '+fmt(p.start)+'</p><button class="btn" data-act="redo-ob">Chỉnh lại hồ sơ</button></div>'+
  '<div class="card"><h2>Sao lưu dữ liệu</h2><p class="small muted">Dữ liệu chỉ nằm trong trình duyệt này. Sao chép đoạn mã dưới đây để lưu, dán lại để khôi phục trên máy khác.</p><textarea id="bk" aria-label="Dữ liệu sao lưu" spellcheck="false"></textarea><div class="row"><button class="btn" data-act="bkcopy">Sao chép</button><button class="btn" data-act="bkimport">Khôi phục từ mã đã dán</button></div></div>'+
  '<div class="card"><h2>Xóa dữ liệu</h2><button class="btn" data-act="reset" style="border-color:var(--bad);color:var(--bad)">Xóa toàn bộ tiến độ</button><p class="small muted" id="rsm"></p></div>'+
  '<div class="card"><h2>Giới thiệu</h2><p class="small">Lộ Trình 90 TOEIC là công cụ tự học miễn phí. Toàn bộ câu hỏi, bài đọc, bài chép chính tả, từ vựng và bài giảng đều do chúng tôi biên soạn. Ứng dụng chỉ để luyện tập, không phải đề thi chính thức và không liên kết với ETS, IIG hay bất kỳ trung tâm luyện thi nào.</p><p class="small muted">Giọng nghe do trình duyệt của bạn tạo ra bằng công nghệ đọc văn bản, nên có thể khác nhau giữa các thiết bị.</p></div>';
}

/* ---------- events ---------- */
document.addEventListener('click',async e=>{
  const ob=e.target.closest('[data-ob]');
  if(ob){OB[ob.dataset.ob]=ob.dataset.v;ob.parentElement.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b===ob));return}
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act;
  switch(a){
   case 'start':{const name=document.getElementById('ob-name').value.trim(),st=document.getElementById('ob-start').value||today();
     S.profile={name,level:OB.level,target:OB.target,daily:OB.daily,start:st};save();location.hash='#home';route();break}
   case 'redo-ob':{S.profile=null;save();route();break}
   case 'toggle':{e.preventDefault();e.stopPropagation();const k=tkey(el.dataset.k);if(S.done[k])delete S.done[k];else{S.done[k]=1;bump(15)}save();route();break}
   case 'play':speak(quiz.qs[quiz.i].ctx.audio,+el.dataset.r);break;
   case 'tr':quiz.showTr=true;renderQuiz();break;
   case 'pick':{const k=+el.dataset.k;if(quiz.mode!=='deferred'&&quiz.picks[quiz.i]!==null)break;quiz.picks[quiz.i]=k;renderQuiz();break}
   case 'next':{if(quiz.mode!=='deferred'&&quiz.picks[quiz.i]===null)break;if(quiz.i===quiz.qs.length-1){quizDone()}else{quiz.i++;quiz.showTr=false;renderQuiz()}break}
   case 'prev':quiz.i--;quiz.showTr=false;renderQuiz();break;
   case 'finish':{const un=quiz.picks.filter(x=>x===null).length;if(un&&!quiz._warned){quiz._warned=1;toast('Còn '+un+' câu chưa trả lời. Bấm Nộp bài lần nữa để nộp.');break}quizDone();break}
   case 'quit':{const b=quiz.back||'practice';quiz=null;if(hasTTS)speechSynthesis.cancel();location.hash='#'+b;route();break}
   case 'close':{quiz=null;route();break}
   case 'mock':{const m=el.dataset.m;startQuiz({title:m==='full'?'Thi thử đầy đủ':'Thi thử ngắn',ids:mockIds(m),mode:'deferred',back:'mock'});break}
   case 'review':case 'reviewall':{const all=Object.keys(S.wrong).filter(id=>QB[id]);let ids=a==='review'?all.filter(id=>S.wrong[id].due<=today()):all;ids=shuffle(ids).slice(0,15);if(!ids.length)break;
     startQuiz({title:'Ôn câu sai',ids,mode:'review',back:'review',onFinish:()=>markDone('log')});break}
   case 'gopen':window._g=+el.dataset.i;route();break;
   case 'gback':window._g=null;route();break;
   case 'gpractice':{const ids=Object.keys(QB).filter(id=>QB[id].topic===el.dataset.k);startQuiz({title:'Luyện ngữ pháp',ids:shuffle(ids).slice(0,8),mode:'instant',back:'gram',onFinish:()=>markDone('gram')});break}
   case 'say':speak(el.dataset.t,.9);break;
   case 'readq':{const i=+el.dataset.i;startQuiz({title:'Đọc hiểu',ids:D.p7[i].qs.map((_,j)=>'p7-'+i+'-'+j),mode:'instant',back:'read',onFinish:()=>markDone('read')});break}
   case 'dopen':DI={i:+el.dataset.i,res:null,val:''};route();break;
   case 'dback':DI=null;if(hasTTS)speechSynthesis.cancel();route();break;
   case 'dplay':speak(D.dict[DI.i].t,+el.dataset.r);break;
   case 'dcheck':{if(!document.getElementById('dtext').value.trim()){toast('Hãy gõ những gì bạn nghe được trước.');break}dictCheck();route();break}
   case 'dshow':{DI.val=document.getElementById('dtext').value;dictCheck();route();break}
   case 'dnext':{const n=DI.i+(+el.dataset.d);if(n>=0&&n<D.dict.length)DI={i:n,res:null,val:''};route();break}
   case 'dsave':{let n=0;DI.res.miss.forEach(w=>{if(!deck().some(c=>c.w===w)){S.words.push({w,p:'từ chép sai',vn:'Nghĩa: tra từ điển. Câu: '+D.dict[DI.i].vn,ex:D.dict[DI.i].t});n++}});save();toast(n?'Đã lưu '+n+' từ':'Các từ này đã có trong bộ từ');break}
   case 'vstart':{const {due,nw}=vocabQueue();VQ={q:due.concat(nw),shown:false,n:0};route();break}
   case 'flip':VQ.shown=true;route();break;
   case 'vsay':e.stopPropagation();speak(VQ.q[0].w,.8);break;
   case 'rate':rateCard(+el.dataset.r);route();break;
   case 'vend':VQ=null;route();break;
   case 'sopen':SP=+el.dataset.i;route();break;
   case 'sback':SP=null;route();break;
   case 'rec':toggleRec(el);break;
   case 'srate':{S.speak[SP]={v:+el.dataset.v,t:today()};bump(20);markDone('speak');toast('Đã lưu lần chấm. +20 XP');route();break}
   case 'theme':S.theme=el.dataset.v;save();route();break;
   case 'bkcopy':{const t=document.getElementById('bk');t.value=JSON.stringify(S);t.select();try{await navigator.clipboard.writeText(t.value);toast('Đã sao chép')}catch(x){toast('Hãy bôi đen và sao chép thủ công')}break}
   case 'bkimport':{try{const r=JSON.parse(document.getElementById('bk').value);if(!r||r.v!==1)throw 0;S=Object.assign(fresh(),r);save();toast('Đã khôi phục');location.hash='#home';route()}catch(x){toast('Mã không hợp lệ')}break}
   case 'reset':{if(el.dataset.s){S=fresh();save();location.hash='#home';route()}else{el.dataset.s=1;el.textContent='Bấm lần nữa để xác nhận xóa';}break}
  }
});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.fc')){e.preventDefault();e.target.click()}});
route();
</script>
